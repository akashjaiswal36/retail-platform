name: Gateway Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/gateway-service/**'
      - '.github/workflows/gateway-ci.yml'
      - '.github/workflows/reusable-java-build.yml'

permissions:
  id-token: write
  contents: read


jobs:
  build-test-scan:
    uses: ./.github/workflows/reusable-java-build.yml
    with:
      service-path: services/gateway-service
      ecr-repository: gateway-service
    secrets: inherit

  deploy:
    needs: build-test-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Clone GitOps repository
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/akashjaiswal36/retail-gitops.git

      - name: Verify GitOps repository
        run: |
          ls -la
          ls -R retail-gitops
          

      - name: Update Helm Values
        run: |
          cd retail-gitops

          sed -i -E "s/^( *tag:).*/\1 ${{ github.sha }}/" apps/gateway-service/values.yaml

          echo "Updated values.yaml"

          cat apps/gateway-service/values.yaml