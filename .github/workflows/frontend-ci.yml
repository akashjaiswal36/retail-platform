name: Frontend Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/reusable-java-build.yml'

permissions:
  id-token: write
  contents: read


jobs:
  CI-Image-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: frontend
      EKS_CLUSTER_NAME: eks-demo-cluster
      RELEASE_NAME: frontend-service
      NAMESPACE: retail-app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::302761015678:role/GitHubActionsECRPushRole
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependency
        working-directory: services/frontend
        run: npm ci

      - name: Build frontend
        working-directory: services/frontend
        run: npm run build

      - name: Build Docker image
        working-directory: services/frontend
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  CD-with-argocd:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: CI-Image-build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Clone GitOps repository
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/akashjaiswal36/retail-gitops.git

      - name: Verify GitOps repository
        run: |
          ls -la
          ls -R retail-gitops
          

      - name: Update Helm Values
        run: |
          cd retail-gitops

          sed -i -E "s/^( *tag:).*/\1 ${{ github.sha }}/" apps/frontend/values.yaml

          echo "Updated values.yaml"

          cat apps/frontend/values.yaml

      - name: Commit and Push GitOps changes
        run: |
          cd retail-gitops

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add apps/frontend/values.yaml

          git commit -m "Update gateway-service image to ${{ github.sha }}" || echo "No changes"

          git push