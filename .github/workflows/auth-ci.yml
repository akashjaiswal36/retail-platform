name: Auth Service CI/CD

on:
  push:
    branches:
      - main
      - feature/auth
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-ci.yml'
      - '.github/workflows/reusable-java-build.yml'

permissions:
  id-token: write
  contents: read


jobs:
  build-test-scan:
    uses: ./.github/workflows/reusable-java-build.yml
    with:
      service-path: services/auth-service
      ecr-repository: auth-service
    secrets: inherit

  deploy:
    needs: build-test-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest


    steps:
      - name: Checkout source
        uses: actions/checkout@v4


      - name: Clone GitOps repository
        run: |
          https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/akashjaiswal36/retail-gitops.git

      - name: Update Helm Values
        run: |
          cd retail-gitops

          sed -i -E "s/^( *tag:).*/\1 ${{ github.sha }}/" apps/auth-service/values.yaml

          echo "Updated values.yaml"

          cat apps/auth-service/values.yaml

      - name: Commit and Push GitOps changes
        run: |
          cd retail-gitops

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add apps/auth-service/values.yaml

          git commit -m "Update auth-service image to ${{ github.sha }}" || echo "No changes"

          git push